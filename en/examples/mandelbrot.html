<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandelbrot • WebAssembly (C → Wasm with Clang)</title>
  <meta name="description" content="Bare-metal Mandelbrot explorer in C compiled to 945-byte WebAssembly without Emscripten">
  <style>
    :root { --bg:#070a12; --card:#10162a; --line:rgba(120,160,255,.18); --accent:#6ee7ff; --accent2:#a78bfa; --text:#e6ecff; --muted:#8b97b8; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
           background: radial-gradient(1200px 600px at 20% -10%, #1b2350 0%, transparent 60%),
                       radial-gradient(900px 500px at 100% 110%, #2a1b50 0%, transparent 55%), var(--bg);
           color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width:min(860px,100%); background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px;
           box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    h1 { margin:0 0 4px; font-size:1.5rem; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    p.sub { margin:0 0 16px; color:var(--muted); font-size:.92rem; }
    canvas { width:100%; height:auto; aspect-ratio:4/3; border-radius:12px; border:1px solid var(--line); display:block; background:#000; cursor:crosshair; image-rendering:auto; }
    .bar { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-top:14px; }
    .stat { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:.82rem; color:var(--accent); background:rgba(110,231,255,.08);
            border:1px solid rgba(110,231,255,.25); padding:5px 10px; border-radius:8px; }
    label { font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:8px; }
    input[type=range] { accent-color: var(--accent2); }
    button { cursor:pointer; border:1px solid var(--line); background:linear-gradient(180deg,#1a2342,#131a33); color:var(--text);
             padding:7px 14px; border-radius:9px; font-size:.85rem; transition:transform .15s, border-color .15s; }
    button:hover { transform:translateY(-1px); border-color:var(--accent); }
    .hint { color:var(--muted); font-size:.8rem; margin-top:10px; }
    #err { color:#ff8a8a; font-family:ui-monospace,Menlo,monospace; white-space:pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Mandelbrot Explorer</h1>
  <p class="sub">Pixel computation executed directly in WebAssembly (<span id="size">…</span>) • Pure C without libc / Emscripten</p>

  <canvas id="cv" width="640" height="480" aria-label="Mandelbrot canvas"></canvas>

  <div class="bar">
    <span class="stat" id="time">— ms</span>
    <span class="stat" id="zoom">zoom 1×</span>
    <label>max_iter <input id="iter" type="range" min="50" max="1500" value="200" step="50"><b id="iterv">200</b></label>
    <button id="reset" type="button">Reset View</button>
  </div>
  <p class="hint">Left-click to center and zoom in • Right-click to zoom out</p>
  <div id="err" role="alert"></div>
</main>

<script>
  // Must be served over HTTP: python3 -m http.server 8000 -> http://localhost:8000/mandelbrot.html
  const W = 640, H = 480;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const view = { cx: -0.5, cy: 0, scale: 3.0 };
  const home = { ...view };
  let wasm;

  async function boot() {
    try {
      const res = await fetch('mandelbrot.wasm');
      const bytes = await res.arrayBuffer();
      $('size').textContent = bytes.byteLength + ' bytes';
      wasm = (await WebAssembly.instantiate(bytes)).instance.exports;
      draw();
    } catch (e) {
      $('err').textContent = 'Failed to load mandelbrot.wasm: ' + e.message +
        '\nCompile using: wasm32-clang -O3 -nostdlib -Wl,--no-entry -Wl,--export=mandel_iter -Wl,--export=render -Wl,--export=get_fb -Wl,--strip-all -o mandelbrot.wasm mandelbrot.c';
    }
  }

  function draw() {
    const maxIter = +$('iter').value;
    const t0 = performance.now();
    wasm.render(W, H, maxIter, view.cx, view.cy, view.scale);
    const dt = performance.now() - t0;
    // Construct fresh TypedArray view on each render to guard against detached buffers
    const pixels = new Uint8ClampedArray(wasm.memory.buffer, wasm.get_fb(), W * H * 4);
    ctx.putImageData(new ImageData(new Uint8ClampedArray(pixels), W, H), 0, 0);
    $('time').textContent = dt.toFixed(1) + ' ms';
    $('zoom').textContent = 'zoom ' + (home.scale / view.scale).toFixed(1) + '×';
  }

  function pickPoint(ev) {
    const r = cv.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    const py = (ev.clientY - r.top) / r.height * H;
    const step = view.scale / W;
    return { x: view.cx - view.scale / 2 + step * px, y: view.cy - step * H / 2 + step * py };
  }

  cv.addEventListener('click', (ev) => { const p = pickPoint(ev); view.cx = p.x; view.cy = p.y; view.scale /= 2; draw(); });
  cv.addEventListener('contextmenu', (ev) => { ev.preventDefault(); const p = pickPoint(ev); view.cx = p.x; view.cy = p.y; view.scale *= 2; draw(); });
  $('iter').addEventListener('input', (e) => { $('iterv').textContent = e.target.value; if (wasm) draw(); });
  $('reset').addEventListener('click', () => { Object.assign(view, home); if (wasm) draw(); });

  boot();
</script>
</body>
</html>

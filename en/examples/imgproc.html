<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wasm Image Studio • Rotate, Crop, Flip, Resize & Filters in WebAssembly</title>
  <meta name="description" content="In-browser image processing studio powered by WebAssembly (C → Wasm via Clang). Rotate, crop, flip, resize, blur, sharpen, and filter entirely inside client sandbox with zero server uploads.">
  <style>
    :root { --bg:#070a12; --card:#10162a; --card2:#0c1122; --line:rgba(120,160,255,.18); --accent:#6ee7ff; --accent2:#a78bfa; --text:#e6ecff; --muted:#8b97b8; --ok:#5eead4; --err:#ff8a8a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:20px; color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
           background: radial-gradient(1200px 600px at 15% -10%, #1b2350 0%, transparent 60%), radial-gradient(900px 500px at 100% 110%, #2a1b50 0%, transparent 55%), var(--bg); }
    header { max-width:1180px; margin:0 auto 14px; }
    h1 { margin:0 0 4px; font-size:1.55rem; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .sub { margin:0; color:var(--muted); font-size:.9rem; }
    .layout { max-width:1180px; margin:0 auto; display:grid; grid-template-columns: 330px 1fr; gap:16px; align-items:start; }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 18px 50px rgba(0,0,0,.4); }
    .group { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
    .group h2 { margin:0 0 8px; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
    .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    button, .btn { cursor:pointer; border:1px solid var(--line); background:linear-gradient(180deg,#1a2342,#131a33); color:var(--text); padding:6px 11px; border-radius:9px; font-size:.82rem; transition:transform .12s, border-color .12s, opacity .12s; }
    button:hover:not(:disabled), .btn:hover { transform:translateY(-1px); border-color:var(--accent); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    button.primary { background:linear-gradient(90deg,#2563eb,#7c3aed); border-color:transparent; }
    label { font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:6px; }
    input[type=number], select { width:78px; background:#0a0f1f; color:var(--text); border:1px solid var(--line); border-radius:7px; padding:5px 6px; font-size:.82rem; }
    select { width:auto; }
    input[type=range] { accent-color:var(--accent2); flex:1; min-width:90px; }
    .val { font-family:ui-monospace,Menlo,monospace; color:var(--accent); min-width:3.2em; text-align:right; font-size:.8rem; }
    .stage { min-height:420px; display:grid; place-items:center; padding:12px; overflow:auto; }
    .wrap { position:relative; display:inline-block; line-height:0; border-radius:8px; overflow:hidden; border:1px solid var(--line);
            background-image: linear-gradient(45deg,#1a2038 25%,transparent 25%),linear-gradient(-45deg,#1a2038 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a2038 75%),linear-gradient(-45deg,transparent 75%,#1a2038 75%);
            background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; background-color:#0f1426; }
    canvas { max-width:100%; max-height:70vh; height:auto; display:block; cursor:crosshair; touch-action:none; }
    #sel { position:absolute; border:2px dashed var(--accent); background:rgba(110,231,255,.12); pointer-events:none; display:none; box-shadow:0 0 0 9999px rgba(0,0,0,.35); }
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
    .stat { font-family:ui-monospace,Menlo,monospace; font-size:.78rem; color:var(--accent); background:rgba(110,231,255,.08); border:1px solid rgba(110,231,255,.25); padding:4px 9px; border-radius:8px; }
    #msg { font-size:.82rem; min-height:1.2em; margin-top:8px; }
    #msg.err { color:var(--err); } #msg.ok { color:var(--ok); }
    .drop { border:2px dashed var(--line); border-radius:12px; padding:10px; text-align:center; color:var(--muted); font-size:.82rem; }
    .drop.over { border-color:var(--accent); color:var(--text); }
    input[type=file] { display:none; }
  </style>
</head>
<body>
<header>
  <h1>Wasm Image Studio</h1>
  <p class="sub">Rotate • Crop • Flip • Resize • Filters — Executed in WebAssembly (<span id="size">…</span>) written in pure C. Zero server transmission.</p>
</header>

<div class="layout">
  <aside class="panel" aria-label="Tools Sidebar">
    <div class="group">
      <h2>File</h2>
      <div class="drop" id="drop">Drag & drop image here or
        <label class="btn" for="file" style="display:inline-flex">Browse File</label>
        <input id="file" type="file" accept="image/*">
      </div>
      <div class="row" style="margin-top:8px">
        <button id="sample" type="button">Sample Image</button>
        <button id="undo" type="button" disabled>↶ Undo</button>
        <button id="reset" type="button" disabled>Reset</button>
        <button id="save" type="button" class="primary" disabled>Download PNG</button>
      </div>
    </div>

    <div class="group">
      <h2>Rotate / Flip</h2>
      <div class="row">
        <button id="rcw" type="button" disabled>⟳ 90° CW</button>
        <button id="r180" type="button" disabled>180°</button>
        <button id="rccw" type="button" disabled>⟲ 90° CCW</button>
        <button id="fh" type="button" disabled>⇋ Horizontal</button>
        <button id="fv" type="button" disabled>⇅ Vertical</button>
      </div>
      <div class="row" style="margin-top:8px">
        <label style="flex:1">Angle <input id="ang" type="range" min="-180" max="180" value="15" step="1"><span class="val" id="angv">15°</span></label>
      </div>
      <div class="row" style="margin-top:6px">
        <label>Background
          <select id="bg"><option value="clear">Transparent</option><option value="white">White</option><option value="black">Black</option></select>
        </label>
        <button id="rany" type="button" disabled>Rotate Angle</button>
      </div>
    </div>

    <div class="group">
      <h2>Crop</h2>
      <div class="row">
        <button id="crop" type="button" disabled>Crop Selection</button>
        <button id="clearsel" type="button" disabled>Clear Box</button>
      </div>
      <div class="row" style="margin-top:6px">
        <span style="font-size:.78rem;color:var(--muted)">Center Crop:</span>
        <button class="cc" data-r="1" type="button" disabled>1:1</button>
        <button class="cc" data-r="1.3333333" type="button" disabled>4:3</button>
        <button class="cc" data-r="1.7777778" type="button" disabled>16:9</button>
      </div>
      <div style="font-size:.74rem;color:var(--muted);margin-top:6px">Click & drag on canvas to select area</div>
    </div>

    <div class="group">
      <h2>Resize</h2>
      <div class="row">
        <label>Width <input id="rw" type="number" min="1" max="4096" disabled></label>
        <label>Height <input id="rh" type="number" min="1" max="4096" disabled></label>
        <button id="resize" type="button" disabled>Apply Size</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="sc" data-s="0.5" type="button" disabled>50%</button>
        <button class="sc" data-s="0.75" type="button" disabled>75%</button>
        <button class="sc" data-s="1.5" type="button" disabled>150%</button>
        <button class="sc" data-s="2" type="button" disabled>200%</button>
        <label><input id="lock" type="checkbox" checked> Constrain Proportions</label>
      </div>
    </div>

    <div class="group">
      <h2>Color / Filters</h2>
      <div class="row">
        <button id="gray" type="button" disabled>Grayscale</button>
        <button id="inv" type="button" disabled>Invert</button>
        <button id="blur" type="button" disabled>Blur</button>
        <button id="sharp" type="button" disabled>Sharpen</button>
        <button id="edge" type="button" disabled>Edge Detect</button>
      </div>
      <div class="row" style="margin-top:8px"><label style="flex:1">Brightness <input id="br" type="range" min="-100" max="100" value="0"><span class="val" id="brv">0</span></label></div>
      <div class="row"><label style="flex:1">Contrast <input id="ct" type="range" min="0" max="250" value="100"><span class="val" id="ctv">100%</span></label></div>
      <div class="row" style="margin-top:6px"><button id="bc" type="button" disabled>Apply Color Grading</button></div>
    </div>
  </aside>

  <main class="panel" aria-label="Viewport Stage">
    <div class="stage">
      <div class="wrap" id="wrap">
        <canvas id="cv" width="640" height="420" aria-label="Active image canvas"></canvas>
        <div id="sel"></div>
      </div>
    </div>
    <div class="bar">
      <span class="stat" id="dim">No Image Loaded</span>
      <span class="stat" id="time">— ms</span>
      <span class="stat" id="hist">History: 0</span>
    </div>
    <div id="msg" role="status"></div>
  </main>
</div>

<script>
  // Must be served over HTTP: python3 -m http.server 8000 -> http://localhost:8000/imgproc.html
  const $ = (id) => document.getElementById(id);
  const MAX_SIDE = 1024;            // Downsample larger frames upon import to ensure arbitrary rotations stay within Wasm buffer limits
  const HISTORY_LIMIT = 25;
  const cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
  let X = null;                     // Wasm exports
  let history = [];                 // [{w,h,data:Uint32Array}]
  let original = null;              // Root snapshot (for Reset)
  let sel = null;                   // Crop bounding box {x,y,w,h}

  const controls = ['rcw','r180','rccw','fh','fv','rany','crop','resize','gray','inv','blur','sharp','edge','bc','save','rw','rh'];
  const groups = ['.cc', '.sc'];

  function say(text, kind) { const m = $('msg'); m.textContent = text || ''; m.className = kind || ''; }
  function enableTools(on) {
    controls.forEach(id => $(id).disabled = !on);
    groups.forEach(s => document.querySelectorAll(s).forEach(b => b.disabled = !on));
  }
  function syncButtons() {
    $('undo').disabled = history.length === 0;
    $('reset').disabled = !original;
    $('clearsel').disabled = !sel;
    $('crop').disabled = !sel;
    $('hist').textContent = 'History: ' + history.length;
  }

  // ---------- Wasm <-> Canvas Bridge ----------
  function srcView() { return new Uint32Array(X.memory.buffer, X.get_src(), X.cur_w() * X.cur_h()); }

  function loadImageData(img) {                     // ImageData -> Wasm src buffer
    if (X.set_size(img.width, img.height) !== 0) throw new Error('Unsupported image dimensions');
    srcView().set(new Uint32Array(img.data.buffer, img.data.byteOffset, img.width * img.height));
  }

  function render() {                               // Wasm src buffer -> Canvas
    const w = X.cur_w(), h = X.cur_h();
    cv.width = w; cv.height = h;
    // Reacquire view on each draw to protect against detached buffer invalidation
    const bytes = new Uint8ClampedArray(new Uint8Array(X.memory.buffer, X.get_src(), w * h * 4));
    ctx.putImageData(new ImageData(bytes, w, h), 0, 0);
    $('dim').textContent = w + ' × ' + h + ' px';
    $('rw').value = w; $('rh').value = h;
    setSel(null);
    syncButtons();
  }

  function snapshot() { return { w: X.cur_w(), h: X.cur_h(), data: new Uint32Array(srcView()) }; }
  function restore(s) { X.set_size(s.w, s.h); srcView().set(s.data); }

  // Execute Wasm operation: on success -> commit + log history; on failure -> alert error without state mutation
  function apply(label, fn) {
    if (!X || !X.cur_w()) return;
    const before = snapshot();
    const t0 = performance.now();
    const r = fn();
    if (r !== 0 || X.commit() !== 0) { say(label + ': Failed (Invalid parameter or buffer overflow)', 'err'); return; }
    $('time').textContent = (performance.now() - t0).toFixed(1) + ' ms';
    history.push(before);
    if (history.length > HISTORY_LIMIT) history.shift();
    render();
    say(label + ' succeeded → ' + X.cur_w() + '×' + X.cur_h(), 'ok');
  }

  // ---------- Image Ingestion ----------
  async function openBitmap(bmp) {
    const s = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * s)), h = Math.max(1, Math.round(bmp.height * s));
    const off = document.createElement('canvas'); off.width = w; off.height = h;
    const octx = off.getContext('2d'); octx.drawImage(bmp, 0, 0, w, h);
    loadImageData(octx.getImageData(0, 0, w, h));
    history = []; original = snapshot();
    enableTools(true); render();
    say(s < 1 ? 'Scaled to ' + w + '×' + h + ' for safe full-pipeline execution' : 'Image loaded successfully', 'ok');
  }
  async function openFile(file) {
    if (!file || !file.type.startsWith('image/')) { say('Please select a valid image file', 'err'); return; }
    try { await openBitmap(await createImageBitmap(file)); } catch (e) { say('Failed to decode image: ' + e.message, 'err'); }
  }

  function makeSample() {                           // Procedural test pattern with distinct rotation/flip orientation markers
    const c = document.createElement('canvas'); c.width = 480; c.height = 320;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 480, 320);
    grad.addColorStop(0, '#1d4ed8'); grad.addColorStop(.5, '#7c3aed'); grad.addColorStop(1, '#db2777');
    g.fillStyle = grad; g.fillRect(0, 0, 480, 320);
    g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(380, 90, 46, 0, 7); g.fill();
    g.fillStyle = '#fde047'; g.fillRect(24, 232, 150, 64);
    g.fillStyle = '#fff'; g.font = 'bold 190px system-ui, sans-serif'; g.textBaseline = 'top'; g.fillText('F', 150, 20);
    g.font = 'bold 20px system-ui, sans-serif'; g.fillStyle = '#0b1020'; g.fillText('TOP-LEFT', 32, 246);
    g.strokeStyle = '#fff'; g.lineWidth = 6; g.strokeRect(3, 3, 474, 314);
    return createImageBitmap(c);
  }

  // ---------- Crop Selection Dragging ----------
  function setSel(s) {
    sel = s;
    const el = $('sel');
    if (!s) { el.style.display = 'none'; syncButtons(); return; }
    const r = cv.getBoundingClientRect(), wr = $('wrap').getBoundingClientRect();
    const kx = r.width / cv.width, ky = r.height / cv.height;
    el.style.display = 'block';
    el.style.left = (r.left - wr.left + s.x * kx) + 'px';
    el.style.top = (r.top - wr.top + s.y * ky) + 'px';
    el.style.width = (s.w * kx) + 'px';
    el.style.height = (s.h * ky) + 'px';
    syncButtons();
  }
  function toImg(ev) {
    const r = cv.getBoundingClientRect();
    return {
      x: Math.min(cv.width, Math.max(0, (ev.clientX - r.left) / r.width * cv.width)),
      y: Math.min(cv.height, Math.max(0, (ev.clientY - r.top) / r.height * cv.height)),
    };
  }
  let drag = null;
  cv.addEventListener('pointerdown', (ev) => { if (!X || !X.cur_w()) return; cv.setPointerCapture(ev.pointerId); drag = toImg(ev); });
  cv.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    const p = toImg(ev);
    const x = Math.round(Math.min(drag.x, p.x)), y = Math.round(Math.min(drag.y, p.y));
    const w = Math.round(Math.abs(p.x - drag.x)), h = Math.round(Math.abs(p.y - drag.y));
    setSel(w > 1 && h > 1 ? { x, y, w, h } : null);
  });
  cv.addEventListener('pointerup', () => { drag = null; if (sel) say('Selected region: ' + sel.w + '×' + sel.h + ' at (' + sel.x + ',' + sel.y + ')'); });
  window.addEventListener('resize', () => { if (sel) setSel(sel); });

  // ---------- Control Bindings ----------
  $('file').addEventListener('change', (e) => openFile(e.target.files[0]));
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => openFile(e.dataTransfer.files[0]));
  $('sample').addEventListener('click', async () => openBitmap(await makeSample()));

  $('undo').addEventListener('click', () => { const s = history.pop(); if (s) { restore(s); render(); say('Undone last action', 'ok'); } });
  $('reset').addEventListener('click', () => { if (original) { restore(original); history = []; render(); say('Reset to initial state', 'ok'); } });
  $('save').addEventListener('click', () => cv.toBlob((b) => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'wasm-image.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png'));

  $('rcw').addEventListener('click', () => apply('Rotate 90° CW', () => X.rotate90(1)));
  $('r180').addEventListener('click', () => apply('Rotate 180°', () => X.rotate90(2)));
  $('rccw').addEventListener('click', () => apply('Rotate 90° CCW', () => X.rotate90(3)));
  $('fh').addEventListener('click', () => apply('Flip Horizontal', () => X.flip(1)));
  $('fv').addEventListener('click', () => apply('Flip Vertical', () => X.flip(2)));

  $('ang').addEventListener('input', (e) => $('angv').textContent = e.target.value + '°');
  $('rany').addEventListener('click', () => {
    const bg = { clear: 0x00000000, white: 0xFFFFFFFF, black: 0xFF000000 }[$('bg').value];
    const deg = +$('ang').value;
    apply('Rotate ' + deg + '°', () => X.rotate_any(deg, bg));
  });

  $('crop').addEventListener('click', () => { if (sel) apply('Crop', () => X.crop(sel.x, sel.y, sel.w, sel.h)); });
  $('clearsel').addEventListener('click', () => setSel(null));
  document.querySelectorAll('.cc').forEach(b => b.addEventListener('click', () => {
    const ratio = +b.dataset.r, w = X.cur_w(), h = X.cur_h();
    let cw = w, ch = Math.round(w / ratio);
    if (ch > h) { ch = h; cw = Math.round(h * ratio); }
    apply('Center Crop ' + b.textContent, () => X.crop((w - cw) >> 1, (h - ch) >> 1, cw, ch));
  }));

  let lastW = 1, lastH = 1;
  $('rw').addEventListener('input', () => { if ($('lock').checked && X.cur_w()) { lastW = X.cur_w(); lastH = X.cur_h(); $('rh').value = Math.max(1, Math.round($('rw').value * lastH / lastW)); } });
  $('rh').addEventListener('input', () => { if ($('lock').checked && X.cur_w()) { lastW = X.cur_w(); lastH = X.cur_h(); $('rw').value = Math.max(1, Math.round($('rh').value * lastW / lastH)); } });
  $('resize').addEventListener('click', () => { const w = +$('rw').value | 0, h = +$('rh').value | 0; apply('Resize', () => X.resize(w, h)); });
  document.querySelectorAll('.sc').forEach(b => b.addEventListener('click', () => {
    const s = +b.dataset.s;
    apply('Resize ' + b.textContent, () => X.resize(Math.max(1, Math.round(X.cur_w() * s)), Math.max(1, Math.round(X.cur_h() * s))));
  }));

  $('gray').addEventListener('click', () => apply('Grayscale', () => X.grayscale()));
  $('inv').addEventListener('click', () => apply('Invert', () => X.invert()));
  $('blur').addEventListener('click', () => apply('Blur', () => X.filter(1)));
  $('sharp').addEventListener('click', () => apply('Sharpen', () => X.filter(2)));
  $('edge').addEventListener('click', () => apply('Edge Detect', () => X.filter(3)));
  $('br').addEventListener('input', (e) => $('brv').textContent = e.target.value);
  $('ct').addEventListener('input', (e) => $('ctv').textContent = e.target.value + '%');
  $('bc').addEventListener('click', () => {
    apply('Brightness / Contrast', () => X.brightness_contrast(+$('br').value, +$('ct').value));
    $('br').value = 0; $('ct').value = 100; $('brv').textContent = '0'; $('ctv').textContent = '100%';
  });

  // ---------- Initialization ----------
  (async function boot() {
    try {
      const bytes = await (await fetch('imgproc.wasm')).arrayBuffer();
      $('size').textContent = (bytes.byteLength / 1024).toFixed(1) + ' KB';
      X = (await WebAssembly.instantiate(bytes)).instance.exports;
      await openBitmap(await makeSample());
    } catch (e) {
      say('Failed to load imgproc.wasm: ' + e.message + ' — Compile with: wasm32-clang -O3 -nostdlib -mbulk-memory -Wl,--no-entry -Wl,--strip-all -o imgproc.wasm imgproc.c', 'err');
    }
  })();
</script>
</body>
</html>
